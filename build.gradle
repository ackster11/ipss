plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
    id 'org.jetbrains.kotlin.jvm'
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.3.20'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url = "https://maven.fabricmc.net/" }
}

loom {
    accessWidenerPath = file("src/main/resources/ipss.accesswidener")

    mods {
        "ip_security_suite" {
            sourceSet sourceSets.main
        }
    }
}

configurations {
    extraLibs
}

dependencies {
    // No mappings line - Minecraft 26.1+ is fully unobfuscated

    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.8.0"
    implementation "io.ktor:ktor-client-okhttp:3.1.0"
    implementation "io.ktor:ktor-client-core:3.1.0"
    implementation "io.ktor:ktor-client-cio-jvm:3.1.0"

    extraLibs "io.ktor:ktor-client-core:3.1.0"
    extraLibs "io.ktor:ktor-client-okhttp:3.1.0"
    extraLibs "io.ktor:ktor-client-cio-jvm:3.1.0"

    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    implementation("net.fabricmc:fabric-language-kotlin:1.13.10+kotlin.2.3.20")
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset = "UTF-8"   // was: filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
            "minecraft_version": project.minecraft_version,
            "loader_version": project.loader_version
    }
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 25
}

kotlin {
    jvmToolchain(25)
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE   // was: duplicatesStrategy DuplicatesStrategy.EXCLUDE
        configurations.extraLibs.collect { it.isDirectory() ? it : zipTree(it) }
    }

    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    repositories {
    }
}